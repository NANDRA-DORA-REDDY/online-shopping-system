<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | ShopEase</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/">ShopEase</a>
    <nav>
      <a class="active" href="/products.html">Products</a>
      <a href="/cart.html">Cart <span id="cart-count" class="badge">0</span></a>
      <a href="/orders.html">Orders</a>
      <a href="/login.html" id="nav-login">Login</a>
      <button class="link-button hidden" id="logout-btn">Logout</button>
    </nav>
  </header>

  <main class="page">
    <div class="page-title">
      <div>
        <p class="eyebrow">Store</p>
        <h1>Products</h1>
      </div>
      <div class="search-row">
        <input id="product-search" type="search" placeholder="Search products...">
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </div>
    </div>

    <div id="product-message" class="message"></div>
    <section id="product-grid" class="product-grid">
      <div class="loading">Loading products...</div>
    </section>
  </main>

  <script src="/js/script.js"></script>
  <script src="/js/products.js"></script>
</body>
</html>
